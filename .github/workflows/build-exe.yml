name: Build JARVIS EXE
on:
  workflow_dispatch:
  push:
    paths:
      - "JARVIS-EXE/**"
      - ".github/workflows/build-exe.yml"
permissions:
  contents: write
concurrency:
  group: jarvis-exe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r JARVIS-EXE/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s JARVIS-EXE/tests -v
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name JARVIS --collect-all pyttsx3 --hidden-import=pyttsx3.drivers.sapi5 JARVIS-EXE/app/main.py
      - name: Publicar EXE em GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-latest
          name: JARVIS EXE — versão mais recente
          body: |
            Executável Windows compilado automaticamente.
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Confira o README para dependências opcionais e configuração inicial.
          files: dist/JARVIS.exe
          fail_on_unmatched_files: true
          make_latest: false
