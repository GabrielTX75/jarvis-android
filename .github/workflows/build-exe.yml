name: Build JARVIS EXE
on:
  workflow_dispatch:
  push:
    paths:
      - "JARVIS-EXE/**"
      - ".github/workflows/build-exe.yml"
  pull_request:
    paths:
      - "JARVIS-EXE/**"
      - ".github/workflows/build-exe.yml"
permissions:
  contents: read
concurrency:
  group: jarvis-exe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r JARVIS-EXE/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s JARVIS-EXE/tests -v
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name JARVIS --collect-all pyttsx3 --collect-all edge_tts --collect-all pygame --hidden-import=pyttsx3.drivers.sapi5 JARVIS-EXE/app/main.py
      - name: Publish development EXE
        if: github.ref == 'refs/heads/jarvis/blueprint-apk-exe-shared'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-exe-branch-latest
          target_commitish: ${{ github.sha }}
          name: JARVIS EXE — branch blueprint
          body: |
            Build de desenvolvimento do JARVIS EXE.
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Release de prévia; não substitui a versão principal.
          files: dist/JARVIS.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
      - name: Publish latest EXE
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: exe-latest
          target_commitish: ${{ github.sha }}
          name: JARVIS EXE — versão mais recente
          body: |
            Executável Windows compilado automaticamente.
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Confira o README para dependências opcionais e configuração inicial.
          files: dist/JARVIS.exe
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
