name: Build JARVIS EXE
on:
  workflow_dispatch:
  push:
    paths:
      - "JARVIS-EXE/**"
      - ".github/workflows/build-exe.yml"
permissions:
  contents: read
concurrency:
  group: jarvis-exe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r JARVIS-EXE/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s JARVIS-EXE/tests -v
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name JARVIS JARVIS-EXE/app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-EXE-${{ github.run_number }}
          path: dist/JARVIS.exe
          if-no-files-found: error
          retention-days: 14
