name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: jarvis-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Baixar o modelo de voz em português
        run: |
          mkdir -p app/src/main/assets
          curl --retry 3 --retry-delay 2 -fsSL -o /tmp/vosk-pt.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q /tmp/vosk-pt.zip -d /tmp/vosk-pt
          mv /tmp/vosk-pt/vosk-model-small-pt-0.3 app/src/main/assets/model-pt
          echo "vosk-model-small-pt-0.3" > app/src/main/assets/model-pt/uuid

      - name: Verificar compilação Kotlin e recursos
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Guardar APK para instalação e teste
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK de teste em Release (somente main)
        if: github.ref == 'refs/heads/main'
        permissions:
          contents: write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JARVIS.apk
          git log -1 --format=%B > notas.md
          echo "" >> notas.md
          echo "APK de depuração gerado pelo commit ${GITHUB_SHA::7}. Não é uma versão assinada de produção." >> notas.md
          gh release create "apk-${GITHUB_RUN_NUMBER}" JARVIS.apk \
            --title "JARVIS APK ${GITHUB_RUN_NUMBER}" \
            --notes-file notas.md \
            --latest
