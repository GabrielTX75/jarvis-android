name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

concurrency:
  group: jarvis-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Baixar o modelo de voz em português
        run: |
          mkdir -p app/src/main/assets
          curl --retry 3 --retry-delay 2 -fsSL -o /tmp/vosk-pt.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q /tmp/vosk-pt.zip -d /tmp/vosk-pt
          mv /tmp/vosk-pt/vosk-model-small-pt-0.3 app/src/main/assets/model-pt
          echo "vosk-model-small-pt-0.3" > app/src/main/assets/model-pt/uuid

      - name: Validar sintaxe JavaScript do app
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("Nenhum script inline encontrado")
          Path("/tmp/jarvis-inline.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/jarvis-inline.js

      - name: Compilar APK de depuração
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK diretamente em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: JARVIS APK — versão mais recente
          body: |
            APK compilado automaticamente a partir do branch ${{ github.ref_name }}.
            Commit: ${{ github.sha }}
            Instale o arquivo JARVIS.apk em um dispositivo Android.
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          make_latest: true
