name: Build APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Baixar o modelo de voz em português
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o /tmp/vosk-pt.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q /tmp/vosk-pt.zip -d /tmp/vosk-pt
          mv /tmp/vosk-pt/vosk-model-small-pt-0.3 app/src/main/assets/model-pt

      - name: Gerar o APK de depuração
        run: gradle :app:assembleDebug --no-daemon

      - name: Guardar o APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar o APK em uma Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk JARVIS.apk
          gh release create "apk-${GITHUB_RUN_NUMBER}" JARVIS.apk \
            --title "JARVIS APK ${GITHUB_RUN_NUMBER}" \
            --notes "APK de depuração gerado pelo commit ${GITHUB_SHA::7}." \
            --latest
