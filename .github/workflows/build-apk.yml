name: Build APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar a Release apk-latest (somente a partir da branch main)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"

# Builds de qualquer branch não precisam de permissão para criar Releases.
permissions:
  contents: read

concurrency:
  group: jarvis-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release != true || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Baixar o modelo de voz em português
        run: |
          mkdir -p app/src/main/assets
          curl --retry 3 --retry-delay 2 -fsSL -o /tmp/vosk-pt.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q /tmp/vosk-pt.zip -d /tmp/vosk-pt
          mv /tmp/vosk-pt/vosk-model-small-pt-0.3 app/src/main/assets/model-pt
          echo "vosk-model-small-pt-0.3" > app/src/main/assets/model-pt/uuid

      - name: Auditar segurança da WebView e do transporte de IA
        run: python3 tools/verify_webview_security.py

      - name: Validar sintaxe do JavaScript local
        run: node --check app/src/main/assets/app.js

      - name: Executar testes unitários
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK de depuração
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Guardar APK como artefato de validação
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publicar Release manual
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Auditar segurança da WebView e do transporte de IA
        run: python3 tools/verify_webview_security.py

      - name: Validar sintaxe do JavaScript local
        run: node --check app/src/main/assets/app.js

      - name: Baixar o modelo de voz em português
        run: |
          mkdir -p app/src/main/assets
          curl --retry 3 --retry-delay 2 -fsSL -o /tmp/vosk-pt.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q /tmp/vosk-pt.zip -d /tmp/vosk-pt
          mv /tmp/vosk-pt/vosk-model-small-pt-0.3 app/src/main/assets/model-pt
          echo "vosk-model-small-pt-0.3" > app/src/main/assets/model-pt/uuid

      - name: Executar testes unitários
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK de depuração
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar APK na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: JARVIS APK — validação mais recente
          body: |
            APK de depuração compilado pelo workflow.
            Este arquivo serve para validação/instalação de teste; não é um instalador de produção assinado.
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: app/build/outputs/apk/debug/*.apk
          fail_on_unmatched_files: true
          make_latest: true
